<ion-header>
  <ion-toolbar>
    <ion-title>Categorías</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content id="main-content" fullscreen="true">
  <h1 class="center-title">Explora los artículos</h1>
  <mat-card *ngFor="let articulo of articulos" class="example-card" appearance="outlined">
    <mat-card-header>
      <div mat-card-avatar class="avatar">
        <img src="assets/avatarp.jpg" alt="User Avatar" />
      </div>
      <mat-card-title>{{ articulo.Id_Usuario }}</mat-card-title>
      <mat-card-subtitle>{{ articulo.Titulo_Articulo }}</mat-card-subtitle>
    </mat-card-header>
    <img mat-card-image [src]="'assets/' + (articulo.Imagen ? articulo.Imagen : 'default.jpg')" alt="Imagen del artículo">
    <mat-card-content>
      <p>
        {{ articulo.Descripcion }}
      </p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button>Me gusta</button>
      <button mat-button>Comentar</button>
    </mat-card-actions>

     <!-- Panel de acciones -->
    <div class="panel-acciones">
      <ion-button color="primary" (click)="editarArticulo(articulo.Id)">
        <ion-icon slot="start" name="create"></ion-icon>
        Editar
      </ion-button>
            
      <ion-button color="danger">
        <ion-icon slot="start" name="trash"></ion-icon>
        Eliminar
      </ion-button>
    </div> 

  </mat-card>

  <mat-card *ngIf="articulos.length === 0" class="example-card">
    <mat-card-content>
      <p>No hay artículos disponibles.</p>
    </mat-card-content>
  </mat-card>
</ion-content>
<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-button expand="block" (click)="AgregarArticulo()">
        <ion-icon slot="start" name="add"></ion-icon>
        Crear Nuevo Artículo
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
