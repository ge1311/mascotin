<ion-header>
  <ion-toolbar>
    <ion-title>Usuarios Actuales</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-card *ngFor="let usuario of usuarios" class="usuario-card">
      <ion-item lines="none">
        <ion-avatar slot="start">
          <img [src]="usuario.Foto_Perfil ? 'assets/' + usuario.Foto_Perfil : 'assets/avatarp.jpg'" alt="Foto de perfil">
        </ion-avatar>
        <ion-label>
          <h2 class="usuario-nickname">{{ usuario.Nickname }}</h2>
          <p><strong>Correo:</strong> {{ usuario.Correo }}</p>
          <p><strong>Teléfono:</strong> {{ usuario.Telefono || 'No disponible' }}</p>
          <p><strong>Estado:</strong> <span [class.activo]="usuario.Activo">{{ usuario.Activo ? 'Activo' : 'Inactivo' }}</span></p>
          <p><strong>Rol:</strong> {{ usuario.Admin ? 'Administrador' : 'Usuario' }}</p>
        </ion-label>
      </ion-item>
    
      <ion-item lines="none">
        <ion-button fill="clear" color="danger" slot="end" (click)="eliminarUsuario(usuario.Id)">
          <ion-icon slot="start" name="trash"></ion-icon>
          Eliminar
        </ion-button>
      </ion-item>
    </ion-card>
    
  </ion-list>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-button expand="block" routerLink="/home">
        Regresar
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
