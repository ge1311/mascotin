<ion-menu content-id="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title>Menú</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-item routerLink="/iniciosesion">
        <ion-label>Iniciar Sesión</ion-label>
      </ion-item>
      <ion-item routerLink="/categorias">
        <ion-label>Categorías</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button (click)="openMenu()"></ion-menu-button>
    </ion-buttons>
    
    <div class="logo-container">
      <img src="assets/logo2.png" alt="Logo" class="logo" /> 
    </div>
  </ion-toolbar>
</ion-header>

<ion-content id="main-content">
  <h1 class="center-title">Regístrate</h1>

  <div class="form-container">
    <form [formGroup]="registroForm" (ngSubmit)="onRegistro()">
      <ion-item>
        <ion-label position="floating">Ingrese nombre de usuario:</ion-label>
        <ion-input formControlName="usuario" type="text"></ion-input>
      </ion-item>
    

      <ion-item>
        <ion-label position="floating">Correo electrónico:</ion-label>
        <ion-input formControlName="email" type="email"></ion-input>
      </ion-item>
  

      <ion-item>
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input formControlName="contrasena" type="password"></ion-input>
      </ion-item>
    </form>
  </div>

  <div>
    <ion-button expand="block" class="register-button" (click)="onRegistro()"> 
      Registrarse
    </ion-button>
  </div>
</ion-content>
