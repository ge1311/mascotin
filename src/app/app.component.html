<!-- app.component.html -->
<ion-app>
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <div class="logo-container">
        <img src="assets/logo2.png" alt="Logo" class="logo" />
      </div>
      <ion-buttons slot="end" *ngIf="usuarioAutenticado">
        <ion-button (click)="irPerfil()">
          <ion-icon name="person" slot="icon-only"></ion-icon> 
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-menu contentId="main-content" autoClose="true" *ngIf="usuarioAutenticado">
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>Menú</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/home">
            <ion-label>Home</ion-label>
          </ion-item>
          <ion-item routerLink="/categorias">
            <ion-label>Categorías</ion-label>
          </ion-item>
          <ion-item routerLink="/articulos">
            <ion-label>Artículos</ion-label>
          </ion-item>
          <ion-item (click)="cerrarSesion()">
            <ion-label>Cerrar sesión</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>
  <ion-content>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-content>
  <jeep-sqlite *ngIf="isWeb"></jeep-sqlite>
</ion-app>
