<!-- app.component.html -->
<ion-app>
  <ion-menu contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>Menú</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-item routerLink="/home">
          <ion-label>Home</ion-label>
        </ion-item>
        <ion-item routerLink="/iniciosesion">
          <ion-label>Iniciar Sesión</ion-label>
        </ion-item>
        <ion-item routerLink="/categorias">
          <ion-label>Categorías</ion-label>
        </ion-item>
        <ion-item routerLink="/articulos">
          <ion-label>Artículos</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <div class="logo-container">
        <img src="assets/logo2.png" alt="Logo" class="logo" />
      </div>
      <ion-buttons slot="end">
        <ion-button routerLink="/perfilusuario">
          <ion-icon name="person" slot="icon-only"></ion-icon> 
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-router-outlet id="main-content"></ion-router-outlet>
  <jeep-sqlite *ngIf="isWeb"></jeep-sqlite>
</ion-app>
