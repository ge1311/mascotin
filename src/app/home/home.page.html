<ion-menu content-id="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menú</ion-title>
      <ion-buttons slot="end">
        <ion-button routerLink="/profile">
          <ion-icon name="person" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-item routerLink="/iniciosesion">
        <ion-label>Iniciar Sesión</ion-label>
      </ion-item>
      <ion-item routerLink="/categorias">
        <ion-label>Categorías</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>
<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <div class="logo-container">
      <img src="assets/logo2.png" alt="Logo" class="logo" />
    </div>
    <ion-buttons slot="end">
      <ion-button routerLink="/perfilusuario">
        <ion-icon name="person" slot="icon-only"></ion-icon> 
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content id="main-content" class="ion-padding">
  <div class="welcome">
    <h1>¡BIENVENIDO A MASCOTIN!</h1>
    <p>Donde las mascotas brillan</p>
  </div>

  <ion-img src="assets/homeP.webp" class="central-img"></ion-img>

  <div class="footer-text">
    <p>Un lugar donde podrás encontrar todo sobre tus mascotas, desde salud hasta anécdotas y reseñas de productos para tu peludo.</p>
  </div>

  <div class="admin-link">
    <a routerLink="/admin" class="admin-link-text">Admin</a>
  </div>

   <!-- Formulario para añadir un elemento -->
   <ion-item>
    <ion-input label="Lenguaje de programacion: " [(ngModel)]="language" name="language"></ion-input>
    <ion-button (click)="create()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-button>
  </ion-item>

  <!-- Lista de todos los elementos -->
  <ion-list>
    <ion-item-sliding *ngFor="let language of languages">

      <!-- elemento -->
      <ion-item>
        <ion-label>{{language}}</ion-label>
      </ion-item>

      <!-- opciones -->
      <ion-item-options>
        <ion-item-option color="warning" (click)="update(language)">
          <ion-icon name="pencil-outline" slot="icon-only"></ion-icon>
        </ion-item-option>
        <ion-item-option color="danger" (click)="delete(language)">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-item-option>
      </ion-item-options>
      
    </ion-item-sliding>


  </ion-list>
  
</ion-content>
